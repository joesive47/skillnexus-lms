name: 🔄 SkillNexus LMS CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'
  DATABASE_URL: 'postgresql://test:test@localhost:5432/test_db'
  NEXTAUTH_SECRET: 'test-secret-key-for-ci'
  NEXTAUTH_URL: 'http://127.0.0.1:3001'
  AUTH_URL: 'http://127.0.0.1:3001'

jobs:
  lint-and-test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📋 Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare ephemeral test database
        run: npx prisma db push --skip-generate
      
      - name: 🔍 Run ESLint
        run: npm run lint
      
      - name: Type check
        run: npm run typecheck

      - name: 🏗️ Build application
        run: npm run build
      
      - name: 🧪 Run tests
        run: npm test
        env:
          CI: true

      - name: Prepare E2E accounts
        run: node scripts/run-all-demo.cjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (Admin, Student, RBAC)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload verified production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skillnexus-verified-build
          path: |
            .next/
            public/
            package.json
            package-lock.json
          retention-days: 7

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Run security audit
        run: npm run security:audit


  build-and-deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Download build that passed all release gates
        uses: actions/download-artifact@v4
        with:
          name: skillnexus-verified-build
          path: .
      
      - name: 🚀 Ready for deployment
        run: |
          echo "✅ SkillNexus LMS build successful!"
          echo "🚀 Ready for production deployment"
          echo "📊 Build artifacts uploaded"
